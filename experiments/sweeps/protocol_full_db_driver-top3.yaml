# Ours under the authors' training settings (their main.py defaults: 50
# epochs, lr 1e-3, weight decay 5e-3, batch 256, 64 neighbours, hidden 128,
# their penalty weights), Base and the full optimizer, on one protocol per
# run: RelBench's (database cut at the test timestamp) or theirs
# (--full-db --strict-time; run this file with those flags in `fixed`).
name: protocol_full_db_driver-top3
fixed:
  column_switches: column  # as run (the default is now channel)
  dataset: rel-f1
  task: driver-top3
  epochs: 50
  lr: 0.001
  weight_decay: 0.005
  batch_size: 256
  num_neighbors: 64
  channels: 128
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0, 1, 2]
arms:
  - model: base
  - model: filter
    fixed:
      lambda_col: 0.001
      lambda_table: 0.01
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      lambda_template: 0.01
      beta_vib: 0.001
      knn_n: 10
      temporal_m: 5
      behavioral_threshold: 0.8
      gate_init: 2.0
