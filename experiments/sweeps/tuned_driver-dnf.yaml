# rel-f1 driver-dnf with the settings tuned on rel-f1 driver-top3 (tuned_base and
# tuned_full sweeps): GraphSAGE baseline and structural optimizer, 3 seeds,
# full-history test (the paper's setup).
name: tuned_rel-f1_driver-dnf
fixed:
  column_switches: column  # as run (the default is now channel)
  dataset: rel-f1
  task: driver-dnf
  epochs: 50
  lr: 0.001
  weight_decay: 0.005
  batch_size: 256
  num_neighbors: 64
  channels: 128
  num_layers: 1
  temporal_strategy: uniform
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0, 1, 2]
arms:
  - model: base
  - model: filter
    grid:
      lambda_all: [0.0001]
    fixed:
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      beta_vib: 0.001
      knn_n: 10
      temporal_m: 5
      behavioral_threshold: 0.8
      gate_init: 2.0
      gate_thresholds: 0.5,0.7,0.78,0.82,0.86,0.9
