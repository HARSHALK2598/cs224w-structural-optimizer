# rel-f1 driver-top3 with the settings saved in the authors' released model,
# on the fixed implementation (per-channel switches, same-subgraph edges,
# early-row statistics, temperature schedule, bottleneck noise start).
# One seed per model. Full-history test.
name: released_driver-top3
fixed:
  dataset: rel-f1
  task: driver-top3
  epochs: 50
  lr: 0.003
  weight_decay: 0.0
  batch_size: 256
  num_layers: 1
  num_neighbors: 16
  channels: 64
  temporal_strategy: last
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0]
arms:
  - model: base
  - model: filter
    fixed:
      column_switches: channel
      lambda_col: 0.1
      lambda_table: 0.0001
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      lambda_template: 0.001
      beta_vib: 0.001
      knn_n: 25
      temporal_m: 3
      behavioral_threshold: 0.95
      gate_init: 2.0
      gate_temperature: 1.0
      gate_temperature_end: 0.5
      gate_warmup_epochs: 10
      gate_thresholds: 0.5,0.7,0.78,0.82,0.86,0.9
