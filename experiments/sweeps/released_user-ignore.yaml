# rel-event user-ignore with the settings saved in the authors' released
# model, on the fixed implementation. One seed per model. Full-history test.
name: released_user-ignore
fixed:
  dataset: rel-event
  task: user-ignore
  epochs: 50
  max_steps_per_epoch: 100000  # theirs: no limit
  lr: 0.001
  weight_decay: 0.005
  batch_size: 256
  num_layers: 2
  num_neighbors: 64
  channels: 128
  temporal_strategy: uniform
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0]
arms:
  - model: base
  - model: filter
    fixed:
      column_switches: channel
      lambda_col: 0.001
      lambda_table: 0.01
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      lambda_template: 0.01
      beta_vib: 0.001
      knn_n: 10
      temporal_m: 5
      behavioral_threshold: 0.8
      gate_init: 2.0
      gate_temperature: 2.0
      gate_temperature_end: 0.3
      gate_warmup_epochs: 5
      gate_thresholds: 0.5,0.7,0.78,0.82,0.86,0.9
