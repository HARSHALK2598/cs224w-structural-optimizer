# The paper's hyperparameter grid (Table 8) for Base and for filtering
# (column + table gates, "FullFilter" in Table 1) on driver-top3. Settings are
# chosen on mean validation ROC-AUC; the best Base and the best filter setting
# are then reported on 5 seeds (paper: Base 81.48 +- 1.06, FullFilter
# 84.66 +- 0.61 test ROC-AUC).
#
# The paper gives no gate start value, gate learning rate or temperature;
# these are fixed at the values validated in the dry runs
# (experiments/results/dryrun_filter/README.md, run 6).
#
#   Base:   3 lr x 3 hidden                 =  9 settings
#   Filter: 3 lr x 3 hidden x 3 lambda x 3 lambda_s = 81 settings
#   x 3 seeds = 270 runs.
name: paper_driver-top3
fixed:
  dataset: rel-f1
  task: driver-top3
  epochs: 20
  dedup_encoder: true
  gate_lr: 0.1
  gate_init: 5.0
seeds: [0, 1, 2]
arms:
  - model: base
    grid:
      lr: [1.0e-4, 1.0e-3, 1.0e-2]
      channels: [64, 128, 256]
  - model: filter
    grid:
      lr: [1.0e-4, 1.0e-3, 1.0e-2]
      channels: [64, 128, 256]
      lambda_col: [1.0e-4, 1.0e-3, 1.0e-2]
      lambda_table: [1.0e-4, 1.0e-3, 1.0e-2]
