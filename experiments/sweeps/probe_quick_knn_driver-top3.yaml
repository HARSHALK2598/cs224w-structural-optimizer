# Plan 04, a quick CPU check: Base against Base + KNN (n = 10) on driver-top3,
# the template the paper finds helps classification (Section 3.3.2).
# Same settings as probe_injection_driver-top3.yaml, 3 seeds.
name: probe_quick_knn_driver-top3
fixed:
  dataset: rel-f1
  task: driver-top3
  dedup_encoder: true
  nan_safe_numerical: true
seeds: [0, 1, 2]
arms:
  - model: base
  - model: base
    fixed: {inject: knn}
    grid: {knn_n: [10]}
