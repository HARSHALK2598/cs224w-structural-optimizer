# Ours under the configuration stored in the authors' released driver-top3
# checkpoint (1 layer, hidden 64, 16 neighbours, lr 3e-3, no weight decay,
# their penalty weights, KNN k 25, recent k 3, similarity 0.95, 'last'
# sampling), with the gate threshold chosen on validation from their six
# values, on their protocol (--full-db --strict-time).
name: released_config_driver-top3
fixed:
  dataset: rel-f1
  task: driver-top3
  epochs: 50
  lr: 0.003
  weight_decay: 0.0
  batch_size: 256
  num_layers: 1
  num_neighbors: 16
  channels: 64
  temporal_strategy: last
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0, 1, 2]
arms:
  - model: base
  - model: filter
    fixed:
      lambda_col: 0.1
      lambda_table: 0.0001
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      lambda_template: 0.001
      beta_vib: 0.001
      knn_n: 25
      temporal_m: 3
      behavioral_threshold: 0.95
      gate_init: 2.0
      gate_thresholds: 0.5,0.7,0.78,0.82,0.86,0.9
