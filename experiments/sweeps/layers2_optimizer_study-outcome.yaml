# rel-trial study-outcome with 2 GNN layers (the tuned settings used 1, which
# only reaches the link tables, not conditions, interventions, sponsors or
# facilities). One seed. Full-history test.
name: layers2_optimizer_study-outcome
fixed:
  column_switches: column  # as run (the default is now channel)
  dataset: rel-trial
  task: study-outcome
  epochs: 50
  lr: 0.001
  weight_decay: 0.005
  batch_size: 256
  num_neighbors: 64
  channels: 128
  num_layers: 2
  temporal_strategy: uniform
  dedup_encoder: true
  nan_safe_numerical: true
  full_db: true
  strict_time: true
seeds: [0]
arms:
  # The paper's best penalties for this task (lambda ~ 1e-3, lambda_k ~ 1e-2):
  - model: filter
    fixed:
      lambda_col: 0.001
      lambda_table: 0.001
      lambda_template: 0.01
      inject: temporal,twohop,knn,behavioral
      template_gates: true
      beta_vib: 0.001
      knn_n: 10
      temporal_m: 5
      behavioral_threshold: 0.8
      gate_init: 2.0
      gate_thresholds: 0.5,0.7,0.78,0.82,0.86,0.9
